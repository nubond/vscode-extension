# Publishes a GitHub Release with the packaged .vsix whenever the version in
# package.json changes on main. The tag (v<version>) is the source of truth for
# "already released": a push that touches package.json without bumping the
# version finds the existing tag and does nothing, and so does a re-run.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists - nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.existing.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.existing.outputs.skip == 'false'
        run: npm ci

      - name: Type-check
        if: steps.existing.outputs.skip == 'false'
        run: npm run check

      - name: Test
        if: steps.existing.outputs.skip == 'false'
        run: npm test

      - name: Package
        if: steps.existing.outputs.skip == 'false'
        run: |
          npm run package
          test -f "${{ steps.version.outputs.vsix }}"

      - name: Create release
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$VSIX" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
